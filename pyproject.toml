[project]
name = "ak"
version = "0.1.0"
description = "AK local AI engine with free offline model support"
authors = [
    {name = "AK Builder", email = "ak@example.com"}
]
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.111.1",
    "uvicorn[standard]>=0.23.2",
    "pydantic>=2.6.0",
    "aiofiles>=23.2.1",
    "python-multipart>=0.0.5",
]

[project.optional-dependencies]
models = [
    "llama-cpp-python>=0.1.72",
    "gpt4all>=1.0.1",
    "transformers>=4.34.0",
    "torch>=2.2.0",
    "sentencepiece>=0.1.99",
]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.27.0",
]

[project.scripts]
ak = "ak.cli:main"

[tool.setuptools.packages.find]
include = ["ak*"]

[tool.pytest.ini_options]
pythonpath = ["."]
