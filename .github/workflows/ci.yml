name: Docodo SaaS CI Pipeline

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build, Typecheck & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/docodo"

      - name: Typecheck (tsc)
        run: npx tsc --noEmit

      - name: Run Test Suite (vitest)
        run: npm test

      - name: Next.js Production Build
        run: npm run build
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/docodo"
          NEXTAUTH_SECRET: "ci-pipeline-build-secret-32-chars-minimum"
          NEXTAUTH_URL: "http://localhost:3000"
